# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  colors.webpage.darkmode.enabled:
    global: false
  colors.webpage.preferred_color_scheme:
    global: dark
  completion.shrink:
    global: false
  completion.use_best_match:
    global: true
  content.autoplay:
    global: false
  content.blocking.method:
    global: both
  content.geolocation:
    https://calendar.fide.com: true
    https://my-location.org: true
    https://open-meteo.com: true
    https://saveparking.com: true
    https://www.decathlon.ie: true
    https://www.doctoralia.es: true
    https://www.google.com: true
    https://www.google.es: true
    https://www.milanuncios.com: true
    https://www.speedtest.net: true
  content.media.audio_capture:
    https://chatgpt.com: true
    https://claude.ai: true
    https://discord.com: true
    https://google-ai-edge.github.io: true
    https://www.chess.com: true
  content.media.audio_video_capture:
    https://lucy.decart.ai: true
    https://meet.google.com: true
  content.media.video_capture:
    https://google-ai-edge.github.io: true
  content.notifications.enabled:
    http://localhost:8096: true
    https://calendar.google.com: true
    https://claude.ai: true
    https://grok.com: true
    https://lovable.dev: true
    https://pomofocus.io: true
    https://saveparking.com: true
    https://www.chess.com: true
    https://www.facebook.com: false
    https://www.opensubtitles.org: false
    https://www.producthunt.com: false
    https://www.youtube.com: true
  content.register_protocol_handler:
    https://calendar.google.com?cid=%25s: true
    https://mail.google.com?extsrc=mailto&url=%25s: true
  fonts.web.size.default:
    global: 16
  tabs.pinned.frozen:
    global: false
