# Razer Barracuda 2.4 dongle — fix device metadata
#
# Fixes:
#   1. Terminal type 0x0301 (Speaker) → headset form factor and icon
#   2. Hide bogus S/PDIF (IEC958) and surround profiles
#   3. Only expose stereo output + mono mic input
#
# WirePlumber 0.5+
# Install to: ~/.config/wireplumber/wireplumber.conf.d/50-openbarracuda.conf
# Also install razer-barracuda.conf to:
#   /usr/share/alsa-card-profile/mixer/profile-sets/razer-barracuda.conf

monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x1532"
        device.product.id = "0x0584"
      }
      {
        device.vendor.id = "0x1532"
        device.product.id = "0x0550"
      }
    ]
    actions = {
      update-props = {
        device.form-factor = "headset"
        device.icon-name = "audio-headset-analog-usb"
        api.alsa.use-acp = true
        device.profile-set = "razer-barracuda.conf"
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-1532_Razer_Barracuda_2.4_.*"
      }
      {
        node.name = "~alsa_output.usb-1532_Razer_Barracuda_X_2.4_.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "Razer Barracuda"
        device.icon_name = "audio-headset"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-1532_Razer_Barracuda_2.4_.*"
      }
      {
        node.name = "~alsa_input.usb-1532_Razer_Barracuda_X_2.4_.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "Razer Barracuda Microphone"
        device.icon_name = "audio-input-microphone"
      }
    }
  }
]
